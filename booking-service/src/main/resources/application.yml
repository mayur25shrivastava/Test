server:
  port: 8081
spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:booking}
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update   # TODO: switch to Flyway migrations
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.tripsaga.common.Reply
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.tripsaga.common
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://jaeger:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        "[saga.duration]": true
        "[http.server.requests]": true
